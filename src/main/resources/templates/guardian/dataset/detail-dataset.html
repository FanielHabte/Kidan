<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dataset detail - Kidan</title>
    <link rel="stylesheet" href="/style/fragments/navigation.css">
    <link rel="stylesheet" href="/style/guardian/dataset/detail-dataset.css">
</head>
<body>
<div th:replace="~{fragments/reusable/navigation::header-nav-bar}"></div>
<main class="dataset-detail-page">

    <!-- Error block: now has width class so it aligns with other sections -->
    <div th:if="${error != null}" class="dd-error">
        <p th:text="${error.toString()}"></p>
    </div>

    <!-- Breadcrumb: now has width + max-width via .page-depth rule -->
    <div class="page-depth">
        <p th:text="'Dataset / ' + ${requested_dataset.name}"></p>
    </div>

    <!-- Header: h1 (was h2), buttons wrapped in .dd-header-actions for flex row -->
    <section class="dd-header">
        <div>
            <h1 th:text="${requested_dataset.name}"></h1>
            <p th:text="${requested_dataset.fileType}"></p>
        </div>
        <div class="dd-header-actions">
            <a th:href="@{/guardian/dataset/edit/{id}(id=${requested_dataset.id})}">Edit dataset</a>
            <a th:href="@{/inlet/submission/new}">Submit file</a>
        </div>
    </section>

    <section class="dd-kpis">
        <div class="dd-kpi-avg-health">
            <h5>Avg health</h5>
            <span class="dd-kpi-number">75.5%</span>
        </div>
        <div class="dd-kpi-submissions">
            <h5>Submissions</h5>
            <span class="dd-kpi-number"
                  th:text="${related_submissions.size()}">
            </span>
        </div>
        <div class="dd-kpi-rules">
            <h5>Rules</h5>
            <span class="dd-kpi-number">3</span>
        </div>
        <div class="dd-kpi-providers">
            <h5>Providers</h5>
            <span class="dd-kpi-number">5</span>
        </div>
    </section>

    <section class="dd-visualization">
        <div class="dd-visualization-header">
            <h4>Health trend</h4>
            <p>Last 30 submissions</p>
        </div>
        <div class="dd-visualization-chart"></div>
    </section>

    <section class="dd-recent-submissions">
        <div class="dd-recent-submissions-header">
            <h4>Recent submissions</h4>
            <p>See all</p>
        </div>
        <div class="dd-recent-submission-list">
            <div class="dd-recent-submission" th:each="submission : ${related_submissions}">
                <div class="dd-recent-submission-name-time">
                    <p th:text="${submission.fileName}">file name</p>
                    <p th:text="${submission.user.name} + ' - ' + ${#temporals.format(submission.createdAt, 'MMM d, h:mm a')}"></p>
                </div>
                <p>-</p>
                <p th:text="${submission.status}">Passed</p>
            </div>
        </div>
    </section>

</main>
</body>
</html>
