<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datasets - Kidan</title>
    <link rel="stylesheet" href="/style/fragments/navigation.css">
    <link rel="stylesheet" href="/style/guardian/dataset/all-datasets.css">
</head>
<body>
<main class="dataset-page-container">
    <div th:replace="~{fragments/reusable/navigation :: header-nav-bar}"></div>
    <section class="datasets-container">
        <div class="page-depth">
            <p>/ Dataset</p>
        </div>
        <div class="datasets-header">
            <h1>Datasets</h1>
            <a class="datasets-button" th:href="@{/guardian/dataset/new}">New dataset</a>
        </div>
        <form class="dataset-filter" method="post" action="datasets/new-dataset/create">
            <button type="button" class="dataset-filter-icon" aria-label="Open dataset filters"></button>
            <label class="dataset-filter-label" for="dataset-type-filter">
                <span class="sr-only">Dataset type</span>
                <select id="dataset-type-filter" name="fileType">
                    <option value="ALL">All types</option>
                    <option value="PDF">PDF</option>
                    <option value="CSV">CSV</option>
                    <option value="DOCX">DOCX</option>
                </select>
            </label>
        </form>
        <div class="datasets-table-card">
            <table class="datasets-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Health</th>
                        <th>Submissions</th>
                        <th>Last activity</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="dataset: ${all_datasets}">
                        <td>
                            <a th:text="${dataset.name}" th:href="@{/guardian/dataset/detail/{id}(id=${dataset.id})}"></a>
                            <img src="/images/icons/new-tab.png" alt="new-tab-icon" class="new-tab-icon">
                        </td>
                        <td><span class="dataset-type-pill" th:text="${dataset.fileType}"></span></td>
                        <td><span class="dataset-health dataset-health-good">-</span></td>
                        <td th:text="${dataset.submissionList.size()}">-</td>
                        <td th:text="${#temporals.format(dataset.updatedAt, 'MMM d, h:mm a')}" ></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
<script th:src="@{script/datasets-page.js}"></script>
</html>
