<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>New contract - Kidan</title>
    <link rel="stylesheet" href="/style/fragments/navigation.css">
    <link rel="stylesheet" href="/style/fragments/new-dataset-progress-bar.css">
    <link rel="stylesheet" href="/style/guardian/contract/new-contract.css">
</head>
<body>
<main class="new-contract-rule-page">
    <div th:replace="~{fragments/reusable/navigation :: header-nav-bar}"></div>
    <div class="new-contract-rule-page-content-container">
        <div th:replace="~{fragments/custom/new-dataset-progress-bar :: nd-progress-bar}"></div>
        <section class="nc-page-section">
            <header class="nc-header">
                <h1>Define validation rules</h1>
                <p>Setup rules to ensure data quality</p>
            </header>
            <div class="nc-validation-info-message">
                <p>Validation rules required</p>
                <p>You must define at least one column validation rule to ensure data quality. Datasets without
                    validation rules cannot be published.</p>
            </div>
            <div class="nc-dataset-detail-container">
                <p>Dataset</p>
                <div class="nc-dataset-detail">
                    <p th:text="${created_dataset.name}"></p>
                    <p th:text="${created_dataset.fileType.toString()}"></p>
                </div>
            </div>
            <form class="nc-form" method="POST" th:action="@{/guardian/contract/new/create}"
                  th:object="${new_contract_form}">
                <!-- Form Card -->
                <div class="nc-form-card">
                    <!-- Structural Rules -->
                    <div class="nc-form-section">
                        <h3>Structural Rules</h3>
                        <!-- Contract name -->
                        <div class="nc-form-field">
                            <label class="nc-field-label" for="nc-name">
                                <span class="nc-required-star">*</span>
                                Contract name
                            </label>
                            <input
                                    id="nc-name"
                                    class="nc-control"
                                    type="text"
                                    placeholder="Q1 2026 Revenue"
                                    th:field="*{csvFileStructure.contractName}"
                                    required
                            >
                        </div>
                        <!-- Column name -->
                        <div class="nc-form-field">
                            <label class="nc-field-label" for="nc-column-names">
                                <span class="nc-required-star">*</span>
                                Column names
                            </label>
                            <input
                                    id="nc-column-names"
                                    class="nc-control"
                                    type="text"
                                    placeholder="country, region, states ,total_sales, profit"
                                    th:field="*{csvFileStructure.columnNames}"
                                    required
                            >
                        </div>
                        <!-- Description -->
                        <div class="nc-form-field">
                            <label class="nc-field-label" for="nc-description">
                                <span class="nc-required-star">*</span>
                                Description
                            </label>
                            <input
                                    id="nc-description"
                                    class="nc-control"
                                    type="text"
                                    placeholder="This is used to validate Q1 2026 revenue that was generated by the finance team."
                                    th:field="*{csvFileStructure.description}"
                                    required
                            >
                        </div>
                        <!-- Delimiter -->
                        <div class="nc-form-field">
                            <label class="nc-field-label" for="nc-delimiter-type">
                                <span class="nc-required-star">*</span>
                                Delimiter
                            </label>
                            <select
                                    id="nc-delimiter-type"
                                    class="nc-control"
                                    th:field="*{csvFileStructure.delimiter}"
                                    required
                            >
                                <option value="COMMA">, (Comma)</option>
                                <option value="PIPE">| (Pipe)</option>
                                <option value="SEMICOLON">; (Semicolon)</option>
                            </select>
                        </div>
                    </div>
                    <!-- Columns Validations-->
                    <div class="nc-form-section nc-form-column-validations-container">
                        <div class="nc-form-column-validation-header">
                            <h3>Column Validations</h3>
                            <button class="nc-add-column" type="button">Add column</button>
                        </div>
                        <div class="nc-form-column-validation item-0"
                             id="column-0"
                        >
                            <div class="nc-form-field">
                                <label class="nc-field-label nc-field-label-header">
                                    <div>
                                        <span class="nc-required-star">*</span>
                                        Name
                                    </div>
                                    <button class="nc-remove-column" type="button">
                                        Remove
                                    </button>
                                </label>
                                <input
                                        class="nc-control"
                                        type="text"
                                        placeholder="Column name"
                                        th:field="*{csvRuleFormList[0].columnName}"
                                        required
                                >
                            </div>
                            <div class="nc-field-grid">
                                <div class="nc-form-field data-type">
                                    <label class="nc-field-label">
                                        <span class="nc-required-star">*</span>
                                        Data type
                                    </label>
                                    <select
                                            class="nc-control"
                                            th:field="*{csvRuleFormList[0].dataType}"
                                    >
                                        <option value="STRING">Text</option>
                                        <option value="INT">Integer</option>
                                        <option value="DECIMAL">Decimal</option>
                                        <option value="DATE">Date</option>
                                        <option value="TIMESTAMP">Timestamp</option>
                                    </select>
                                </div>
                                <!-- String -->
                                <div class="nc-form-field format-rule string-format show">
                                    <label class="nc-field-label keyword-word">
                                        Keywords
                                    </label>
                                    <input
                                            class="nc-control"
                                            placeholder="E.g., {key word 1, keyword 2, keyword3}"
                                            th:field="*{csvRuleFormList[0].keywords}"
                                            required
                                    >
                                </div>
                            </div>
                            <div class="nc-checkbox-grid">
                                <label class="nc-checkbox-field">
                                    <input type="checkbox" th:field="*{csvRuleFormList[0].isRequired}">
                                    <span>Required</span>
                                </label>
                                <label class="nc-checkbox-field">
                                    <input type="checkbox" th:field="*{csvRuleFormList[0].isUnique}">
                                    <span>Unique</span>
                                </label>
                            </div>
                        </div>

                    </div>
                </div>
                <!--  -->
                <div class="nc-form-action-container">
                    <a class="nc-button nc-button-secondary" th:href="@{/guardian/dataset/new}">Back</a>
                    <button type="submit" class="nc-button nc-button-primary">Review</button>
                </div>
            </form>
        </section>
    </div>
</main>
</body>
<script src="/script/new-contract.js"></script>
<script th:src="@{/webjars/htmx.org/2.0.0/dist/htmx.min.js}"></script>
</html>
