<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Kidan</title>
    <link rel="stylesheet" href="/style/nexus/login.css">
    <link rel="stylesheet" href="/style/fragments/header.css">
</head>
<body>
<div th:replace="~{fragments/reusable/header :: header-fragment}"></div>
<div id="login-body">

    <div id="login-header">
        <h1>Welcome back</h1>
        <p>Login to continue managing your datasets</p>
    </div>

    <form id="login-form" method="POST" th:action="@{/login}">
        <div th:if="${param.error}" class="login-error">
            Invalid username or password.
        </div>
        <label for="login-email">
            <span>Email</span>
            <input id="login-email" type="email" name="username" placeholder="john@example.com">
        </label>
        <label for="login-password">
            <span>Password</span>
            <input id="login-password" type="password" name="password" placeholder="Enter your password">
        </label>
        <span class="login-forgot">Forgot password?</span>
        <button type="submit">Log in</button>
    </form>

    <fieldset id="login-separator">
        <legend>or</legend>
    </fieldset>

    <div id="login-signup-option">
        <p>Don't have an account? <a th:href="@{/signup}">Sign up</a></p>
    </div>

</div>
</body>
</html>
